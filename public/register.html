<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Vantage Financial Alliance</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f8f8f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); width: 100%; max-width: 420px; margin: 20px; }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo h1 { font-size: 24px; color: #2c2c2c; font-weight: 700; }
    .logo span { color: #f7c547; }
    h2 { font-size: 28px; color: #2c2c2c; margin-bottom: 8px; text-align: center; }
    .subtitle { color: #888; text-align: center; margin-bottom: 32px; font-size: 14px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; color: #2c2c2c; margin-bottom: 6px; font-weight: 500; }
    input { width: 100%; padding: 12px 16px; border: 1px solid #dbdbdb; border-radius: 8px; font-size: 14px; font-family: inherit; transition: border-color 0.2s; }
    input:focus { outline: none; border-color: #f7c547; }
    .btn { width: 100%; padding: 14px; background: #2c2c2c; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #1a1a1a; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .error { background: #fee; color: #f24; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; display: none; }
    .success { background: #efe; color: #060; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; display: none; }
    .link { text-align: center; margin-top: 24px; font-size: 14px; color: #888; }
    .link a { color: #2c2c2c; text-decoration: none; font-weight: 600; }
    .link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>VANTAGE <span>FINANCIAL</span></h1>
    </div>
    <h2>Create Account</h2>
    <p class="subtitle">Join Vantage Financial Alliance</p>
    
    <div class="error" id="error"></div>
    <div class="success" id="success"></div>
    
    <form id="registerForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" required placeholder="John Smith">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required minlength="6" placeholder="Min. 6 characters">
      </div>
      <button type="submit" class="btn" id="submitBtn">Create Account</button>
    </form>
    
    <p class="link">Already have an account? <a href="/login">Sign in</a></p>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('error');
      const successEl = document.getElementById('success');
      const btn = document.getElementById('submitBtn');
      
      errorEl.style.display = 'none';
      successEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Creating account...';
      
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        
        const data = await res.json();
        
        if (data.success) {
          successEl.textContent = 'Account created! Redirecting to login...';
          successEl.style.display = 'block';
          setTimeout(() => { window.location.href = '/login'; }, 1500);
        } else {
          errorEl.textContent = data.error;
          errorEl.style.display = 'block';
        }
      } catch (err) {
        errorEl.textContent = 'Something went wrong. Try again.';
        errorEl.style.display = 'block';
      }
      
      btn.disabled = false;
      btn.textContent = 'Create Account';
    });
  </script>
</body>
</html>
